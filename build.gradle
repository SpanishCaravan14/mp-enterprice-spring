plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.openapi.generator' version '7.5.0'
}

group = 'ru.mentee.library'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
}

ext {
    set('testcontainersVersion', "1.19.7")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.liquibase:liquibase-core'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.15'

    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    annotationProcessor("org.hibernate.orm:hibernate-jpamodelgen")
    compileOnly("org.hibernate.orm:hibernate-jpamodelgen")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.instancio:instancio-junit:5.4.1'

}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
        endWithNewline()
    }
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "${project.rootDir}/src/main/resources/openapi/api-spec.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = "ru.mentee.api.controller"
    modelPackage = "ru.mentee.app.api.generated.dto"
    configOptions = [
            dateLibrary: "java8",
            interfaceOnly: "true",
            useTags: "true",
            performBeanValidation: "true",
            useBeanValidation: "true",
            useSpringBoot3: "true",
            delegatePattern: "true"
    ]
}