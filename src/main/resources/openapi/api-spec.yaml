openapi: 3.0.3
info:
  title: Online Learning Platform API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  /courses:
    get:
      summary: Получить список курсов
      operationId: getCourses
      tags:
        - Courses
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
            enum: [application/json, application/xml, text/csv]
        - name: category
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [BEGINNER, INTERMEDIATE, ADVANCED]
      responses:
        '200':
          description: Список курсов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
            application/xml:
              schema:
                $ref: '#/components/schemas/CourseList'
            text/csv:
              schema:
                type: string

  /courses/{courseId}/enroll:
    post:
      summary: Записаться на курс (async)
      operationId: enrollCourse
      tags:
        - Courses
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Запрос принят в обработку
          headers:
            Location:
              schema:
                type: string
                description: URL для проверки статуса
  /courses/{courseId}/enroll/status:
    get:
      summary: Получить статус записи на курс
      operationId: getStatus
      tags:
        - Courses
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Получен статус записи на курс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollStatus'

  /courses/{courseId}/lessons/{lessonId}/video:
    post:
      summary: Загрузить видео урока
      operationId: uploadLesson
      tags:
        - Lessons
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                duration:
                  type: integer
      responses:
        '201':
          description: Видео загружено

  /notifications/stream:
    get:
      summary: Подписаться на уведомления (SSE)
      operationId: subscribeForNotifications
      tags:
        - Notifications
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /users/me/progress:
    get:
      summary: Прогресс текущего пользователя
      operationId: getUserProgress
      tags:
        - Users
      responses:
        '200':
          description: Информация о прогрессе

components:
  schemas:
    Course:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        duration:
          type: integer
          description: Продолжительность в часах
        price:
          type: number
        instructor:
          $ref: '#/components/schemas/Instructor'

    CourseList:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        totalCount:
          type: integer
    Instructor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    EnrollStatus:
      type: object
      properties:
        status:
          type: string