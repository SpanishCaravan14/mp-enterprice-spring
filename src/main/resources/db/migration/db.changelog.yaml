databaseChangeLog:
  - changeSet:
      id: 1
      author: sergey_lelekin
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_account_user
                    references: users(id)
              - column:
                  name: balance
                  type: DECIMAL
                  constraints:
                    nullable: false
                    defaultValueDecimal: 0.00
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
                    defaultValue: RUB
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    defaultValueBoolean: true
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: operation
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: details
                  type: TEXT
        - createTable:
            tableName: money_transaction
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_from_account_id
                    references: users(id)
              - column:
                  name: to_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_to_account_id
                    references: users(id)
              - column:
                  name: amount
                  type: DECIMAL
                  constraints:
                    nullable: false
              - column:
                  name: time_stamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 2026-01-12-2
      author: sergey_lelekin
      changes:
        # Создание новой колонки
        - addColumn:
            tableName: audit_log
            columns:
              - column:
                  name: user_login
                  type: varchar(255)
                  constraints:
                    nullable: true
        - dropColumn:
            tableName: audit_log
            columnName: user_id
        - addForeignKeyConstraint:
            baseTableName: audit_log
            baseColumnNames: user_login
            referencedTableName: users
            referencedColumnNames: login
            constraintName: fk_audit_log_user_login
            onDelete: NO ACTION
            onUpdate: NO ACTION
  - changeSet:
      id: 2026-01-12-3
      author: sergey_lelekin
      changes:
        # Удаление старых внешних ключей
        - dropForeignKeyConstraint:
            baseTableName: money_transaction
            constraintName: fk_from_account_id

        - dropForeignKeyConstraint:
            baseTableName: money_transaction
            constraintName: fk_to_account_id

        # Добавление новых внешних ключей на таблицу account
        - addForeignKeyConstraint:
            baseTableName: money_transaction
            baseColumnNames: from_account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_from_account_id
            onDelete: NO ACTION
            onUpdate: NO ACTION

        - addForeignKeyConstraint:
            baseTableName: money_transaction
            baseColumnNames: to_account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_to_account_id
            onDelete: NO ACTION
            onUpdate: NO ACTION