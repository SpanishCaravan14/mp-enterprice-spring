databaseChangeLog:
  - changeSet:
      id: 1
      author: sergey_lelekin
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL
                  constraints:
                    nullable: false
                    defaultValueDecimal: 0.00
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
                    defaultValue: RUB
        - addCheckConstraint:
            tableName: account
            constraintName: chk_account_balance_non_negative
            columnNames: balance
            checkExpression: balance >= 0